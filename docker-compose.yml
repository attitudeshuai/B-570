version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: property-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: property_db
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --init-connect=SET NAMES utf8mb4
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - property-network

  # 后端SpringBoot服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: property-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - property-network

  # 前端Vue服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: property-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - property-network

networks:
  property-network:
    driver: bridge

volumes:
  mysql_data:
